name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libasound2-dev libx11-dev \
        libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev xorg-dev

    - name: Build project
      run: make

    - name: Run tests
      run: ./test/test_maps.sh
