name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libasound2-dev libx11-dev \
        libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev xorg-dev

    - name: Configure CMake
      run: cmake -B build

    - name: Build project
      run: cmake --build build

    - name: Run internal C logic tests (--test)
      run: ./build/so_long --test

    - name: Run batch map validation script
      run: ./test/test_maps.sh
